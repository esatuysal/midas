name: Veri güncelle
on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test mesajı gönder"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_data.py
      - name: Uyarılar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alerts.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json alerts_state.json
          git diff --cached --quiet || (git commit -m "veri guncelle" && git push)
